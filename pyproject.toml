[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clpgen"
version = "0.1.0"
description = "Research scaffold for high-fidelity controllable Chinese landscape painting generation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Codex" }
]
dependencies = [
  "accelerate>=0.30.0",
  "datasets>=2.18.0",
  "numpy>=1.26.0",
  "opencv-python>=4.9.0",
  "pandas>=2.2.0",
  "Pillow>=10.0.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.0",
  "scikit-image>=0.22.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.12.0",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "tqdm>=4.66.0",
  "transformers>=4.40.0",
]

[project.optional-dependencies]
gen = [
  "diffusers>=0.30.0",
  "peft>=0.11.0",
  "safetensors>=0.4.0",
  "xformers>=0.0.25.post1; platform_system != 'Windows'",
]
metrics = [
  "clean-fid>=0.1.35",
  "hpsv2>=1.2.0",
  "lpips>=0.1.4",
  "open-clip-torch>=2.24.0",
  "torchmetrics>=1.3.0",
]
dev = [
  "black>=24.0.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
