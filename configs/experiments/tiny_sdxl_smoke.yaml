project:
  name: clpgen-tiny-smoke
  seed: 0
  output_root: outputs/tiny_sdxl_smoke

dataset:
  manifest_path: data/processed/clp4k/manifest.jsonl
  image_size: 64
  prompt_mode_train: short

model:
  base_model: hf-internal-testing/tiny-stable-diffusion-xl-pipe
  pretrained_vae:
  variant:
  use_safetensors: false
  local_files_only: false
  resolution_train: 64
  resolution_infer: 64
  lora:
    rank: 4
    alpha: 4
    unet_target_modules: [to_q, to_k, to_v, to_out.0]
    text_encoder_target_modules: [q_proj, k_proj, v_proj, out_proj]
    train_text_encoder: true
    weights_path:
  hierarchical_adapter:
    in_channels: 4
    base_channels: 32
    token_dim: 128
    levels: 4
    pooled_sizes: [8, 4, 2, 1]
    weights_path:
  style_reference:
    enabled: false

training:
  batch_size: 1
  learning_rate: 1.0e-4
  adapter_learning_rate: 5.0e-5
  num_epochs: 1
  max_train_steps: 1
  checkpoint_every: 1
  mixed_precision: fp16
  gradient_checkpointing: false
  max_grad_norm: 1.0
  num_workers: 0

inference:
  num_inference_steps: 2
  guidance_scale: 3.0
