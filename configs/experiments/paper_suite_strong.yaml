    to: paper_lora_only_817_seed42/evaluation_multiseed
significance:
  left: paper_ours_817_seed42/evaluation_multiseed/per_sample_metrics.csv
  metrics: clipscore,pickscore,hpsv2,style_correct,edge_consistency,blank_space_iou,blank_space_ssim
  comparisons:
    lora: paper_lora_only_817_seed42/evaluation_multiseed/per_sample_metrics.csv
    controlnet: paper_controlnet_817_seed42/evaluation_multiseed/per_sample_metrics.csv
    ip_adapter_only: paper_ip_adapter_only_817_seed42/evaluation_multiseed/per_sample_metrics.csv
